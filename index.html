<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOGARITHM · АП-2 — переписка с неизвестным абонентом</title>
<meta name="description" content="Терминал советской ЭВМ: переписка с неизвестным абонентом, который обещает угадать ваше число от 1 до 100 000 за 17 вопросов — и раскрыть, что такое логарифм.">
<meta name="theme-color" content="#050805">
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Экран загрузки ЭВМ -->
<div id="boot" role="dialog" aria-label="Загрузка терминала">
  <pre id="bootLines" aria-live="polite"></pre>
</div>

<!-- Терминал -->
<div id="crt" aria-label="Терминал переписки">
  <header id="bar">
    <div class="bar-left">
      <button id="btnMenu" class="tbtn" aria-haspopup="true" aria-expanded="false">СЕАНСЫ ▾</button>
      <button id="btnPrevEp" class="tbtn tbtn--sq" title="Предыдущий сеанс">‹</button>
      <button id="btnNextEp" class="tbtn tbtn--sq" title="Следующий сеанс">›</button>
      <button id="btnRestart" class="tbtn tbtn--sq" title="Перезапустить сеанс">↺</button>
    </div>
    <div id="sessLabel" class="sess-label">СЕАНС --</div>
    <div class="bar-right">
      <div id="sessProgress" aria-label="Прогресс по сеансам"></div>
      <span id="linkDot" class="link-dot">● СВЯЗЬ</span>
    </div>
    <div id="menuPop" class="menu-pop" hidden></div>
  </header>

  <main id="feed" tabindex="-1" aria-live="polite" aria-label="Лента переписки"></main>

  <footer id="deck">
    <div id="choicePrompt" class="deck-prompt" hidden></div>
    <div id="choices" role="group" aria-label="Варианты ответа"></div>
    <div id="hint" class="deck-hint">[1–9] — выбор · [пробел / клик] — ускорить печать</div>
  </footer>
</div>

<!-- Оверлей эффектов: выключение ЭЛТ, помехи -->
<div id="fx" aria-hidden="true"></div>

<script src="js/core.js"></script>
<script src="js/ascii.js"></script>
<script src="js/sc01.js"></script>
<script src="js/sc02.js"></script>
<script src="js/sc03.js"></script>
<script src="js/sc04.js"></script>
<script src="js/sc05.js"></script>
<script src="js/sc06.js"></script>
<script src="js/sc07.js"></script>
<script src="js/sc08.js"></script>
<script src="js/lab.js"></script>
<script>TERM.boot();</script>
</body>
</html>
