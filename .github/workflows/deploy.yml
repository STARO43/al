# Деплой Берлоги на GitHub Pages — статический экспорт Next.js.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # если репозиторий не <user>.github.io — раскомментируйте basePath:
      # env:
      #   NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      env:
        NEXT_PUBLIC_STATIC_EXPORT: "1"
      - run: bun run build:static
      - name: Спецфайлы GitHub Pages
        run: |
          touch out/.nojekyll
          if [ -f out/404/index.html ]; then cp out/404/index.html out/404.html; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
